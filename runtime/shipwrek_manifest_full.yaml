# ShipWrekD AI OS — Full Constellation Manifest
# 
# Defines which agents boot, their outfits, tiers, and capabilities.
# The OS reads this, assembles outfits from costume_registry.yaml,
# and spawns ShipWrekAgents with persona-specific behaviors.
#
# Usage:
#   python3 shipwrekd_os.py --manifest full     # Boot this manifest
#   python3 shipwrekd_os.py --manifest small    # Boot a subset

swarm_name: "ShipWrekD Mainnet"
description: "Full constellation — all persona groups active"

